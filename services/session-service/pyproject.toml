[project]
name = "cube-session-service"
version = "0.1.0"
description = "Cube.com Session & Matchmaking Service (FastAPI + Redis + WebSocket + gRPC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "redis>=5.1.0",
    "websockets>=13.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "grpcio>=1.66.2",
    "protobuf>=5.28.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

