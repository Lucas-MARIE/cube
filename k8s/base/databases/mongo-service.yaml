# =============================================================================
# Service Kubernetes pour MongoDB
# =============================================================================
# Expose MongoDB en interne dans le cluster
# Accessible via : mongo.cube.svc.cluster.local:27017
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: cube
  labels:
    app: mongo
    tier: database
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: cube
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      protocol: TCP
