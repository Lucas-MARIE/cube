# =============================================================================
# Service Kubernetes pour PostgreSQL
# =============================================================================
# Expose PostgreSQL en interne dans le cluster
# Les services y accèdent via : postgres.cube.svc.cluster.local:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cube
  labels:
    app: postgres
    tier: database
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cube
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
