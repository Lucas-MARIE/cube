# =============================================================================
# Secret pour PostgreSQL
# =============================================================================
# ⚠️ EXEMPLE UNIQUEMENT - NE PAS UTILISER EN PRODUCTION TEL QUEL
# En production, utiliser :
#   - Sealed Secrets (Bitnami)
#   - External Secrets Operator
#   - HashiCorp Vault
#   - SOPS avec age/GPG
# Les valeurs ci-dessous sont encodées en base64 (ce n'est PAS du chiffrement)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cube
  labels:
    app: postgres
    tier: database
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cube
type: Opaque
data:
  # echo -n 'cube_user' | base64 => Y3ViZV91c2Vy
  POSTGRES_USER: Y3ViZV91c2Vy
  # echo -n 'cube_pass_change_me' | base64 => Y3ViZV9wYXNzX2NoYW5nZV9tZQ==
  POSTGRES_PASSWORD: Y3ViZV9wYXNzX2NoYW5nZV9tZQ==
  # echo -n 'cube_db' | base64 => Y3ViZV9kYg==
  POSTGRES_DB: Y3ViZV9kYg==
