# =============================================================================
# Service Kubernetes pour le Learning Service
# =============================================================================
# Expose le learning-service en interne dans le cluster via ClusterIP
# Accessible via : learning-service.cube.svc.cluster.local:8002
apiVersion: v1
kind: Service
metadata:
  name: learning-service
  namespace: cube
  labels:
    app: learning-service
    tier: backend
    app.kubernetes.io/name: learning-service
    app.kubernetes.io/part-of: cube
spec:
  type: ClusterIP
  selector:
    app: learning-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
