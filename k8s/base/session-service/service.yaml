# =============================================================================
# Service Kubernetes pour le Session Service
# =============================================================================
# Expose le session-service en interne dans le cluster via ClusterIP
# Accessible via : session-service.cube.svc.cluster.local:8003
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: cube
  labels:
    app: session-service
    tier: backend
    app.kubernetes.io/name: session-service
    app.kubernetes.io/part-of: cube
spec:
  type: ClusterIP
  selector:
    app: session-service
  ports:
    # Port HTTP/WebSocket
    - name: http
      port: 8003
      targetPort: 8003
      protocol: TCP
    # Port gRPC
    - name: grpc
      port: 50052
      targetPort: 50052
      protocol: TCP
