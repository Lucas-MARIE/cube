# ============================================================
# Cube.com API Gateway - Nginx Reverse Proxy Configuration
# Routes API requests to the appropriate backend microservice.
# ============================================================

upstream user_service {
    server user-service:8001;
}

upstream learning_service {
    server learning-service:8002;
}

upstream session_service {
    server session-service:8003;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 8080;
    server_name localhost;

    # --- CORS Headers ---
    # Applied globally; adjust allowed origins for production.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
    add_header Access-Control-Max-Age 3600 always;

    # Handle CORS preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # --- Common Proxy Headers ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- API Routes ---

    # User Service: authentication, profiles, statistics
    location /api/users/ {
        proxy_pass http://user_service/api/users/;
    }

    # Learning Service: lessons, algorithms, scrambles
    location /api/lessons/ {
        proxy_pass http://learning_service/api/lessons/;
    }

    # Session Service: solve sessions, timer, history
    # Includes WebSocket support for real-time timer sync
    location /api/sessions/ {
        proxy_pass http://session_service/api/sessions/;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Frontend (catch-all) ---
    location / {
        proxy_pass http://frontend;
    }

    # --- Health check endpoint for the gateway itself ---
    location /health {
        access_log off;
        return 200 '{"status": "ok", "service": "gateway"}';
        add_header Content-Type application/json;
    }
}
